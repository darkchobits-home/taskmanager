spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanager_db
    username: taskmanageruser
    password: taskmanagerpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: change-me-replace-with-long-random
  expiration-ms: 3600000
